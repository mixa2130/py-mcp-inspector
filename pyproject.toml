[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymcpinspector"
version = "0.1.0"
description = "A Python MCP Inspector: connect to MCP servers over stdio, SSE or Streamable HTTP, with full control over request headers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Opt-in: `pip install -e ".[dev]"`. Deliberately not mirrored in a requirements
# file -- one place to change, nothing to drift. tests/test_packaging.py checks
# that an ordinary install brings none of it.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
pymcpinspector = "pymcpinspector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pymcpinspector"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI route handlers legitimately call Body()/Depends() in argument defaults.
"pymcpinspector/app.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
